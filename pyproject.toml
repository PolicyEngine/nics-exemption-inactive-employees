[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nics-exemption"
version = "0.1.0"
description = "Data pipeline for modelling NICs exemption for recently-inactive employees."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "microdf-python>=1.2.0",
]

[project.optional-dependencies]
simulation = [
  "policyengine-uk>=2.88.10",
  # Steps 4-5 impute with microimpute. The published results come from a run
  # on 2026-06-12 (71add6e) and record no microimpute version. Resolving the
  # requirements as they stood with uv's --exclude-newer gives 1.15.1 on
  # 2026-04-01 (the first commit), 2.0.4 on 2026-04-29 and 2026-04-30, and
  # 3.1.1 on 2026-06-12, and an environment someone kept from an earlier date
  # could hold any release from 1.15.1 to 3.1.1. The pin takes 3.1.1, the
  # release a fresh install would have got on the day of that run, as a
  # choice, not a record. The candidates can give different results: up to
  # 2.0.2, microimpute resamples donors by weight and fits the forest
  # unweighted, while 2.0.3 and later pass the weights to the forest. 3.1.1
  # caps scikit-learn below 1.9 itself. PolicyEngine archived microimpute on
  # 2026-11-08; an unpinned install gets its last release, 3.4.1, and PyPI
  # keeps 3.1.1 installable.
  "microimpute==3.1.1",
]
dev = [
  "packaging",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
nics-exemption-build = "nics_exemption.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/nics-exemption-inactive-employees"
Repository = "https://github.com/PolicyEngine/nics-exemption-inactive-employees"

[tool.hatch.build.targets.wheel]
packages = ["src/nics_exemption"]

[tool.hatch.build.targets.sdist]
include = [
  "src/nics_exemption/**/*.py",
  "tests/**/*.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
