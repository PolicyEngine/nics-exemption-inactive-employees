[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nics-exemption"
version = "0.1.0"
description = "Data pipeline for modelling NICs exemption for recently-inactive employees."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "microdf-python>=1.2.0",
]

[project.optional-dependencies]
simulation = [
  "policyengine-uk>=2.88.10",
  # The published results (run 2026-06-12) do not record a microimpute
  # version. pip resolved 1.15.1 when this study was set up on 2026-04-01,
  # and nothing in the history required a newer release; a fresh install
  # on 2026-06-12 would have got 3.1.1 instead. The exact pin keeps a rerun
  # on the setup release rather than the newest one, 3.4.1. PolicyEngine
  # archived microimpute on 2026-11-08, and PyPI keeps 1.15.1 installable.
  # 1.15.1 allows scikit-learn 1.9 (2026-06-02), whose random forests draw
  # each bootstrap sample by sample weight instead of passing the weights
  # to the trees, so the cap keeps scikit-learn 1.8, which the published
  # run's environment most likely held.
  "microimpute==1.15.1",
  "scikit-learn<1.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
nics-exemption-build = "nics_exemption.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/nics-exemption-inactive-employees"
Repository = "https://github.com/PolicyEngine/nics-exemption-inactive-employees"

[tool.hatch.build.targets.wheel]
packages = ["src/nics_exemption"]

[tool.hatch.build.targets.sdist]
include = [
  "src/nics_exemption/**/*.py",
  "tests/**/*.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
